name: KinoUkr DB update

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new titles from kinoukr.tv
        run: python3 tools/kinoukr_update.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git config user.name "kinoukr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kinoukr_db.json tools/kinoukr_known.json
          git commit -m "KinoUkr DB: daily update"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
